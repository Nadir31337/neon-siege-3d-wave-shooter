<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Siege - 3D Synthwave Survival</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050510;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #ffffff;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* UI Overlay Layer */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Hit Flash Overlay */
    #damage-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(255, 0, 85, 0.4) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
      z-index: 5;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #00f3ff;
      box-shadow: 0 0 8px #00f3ff;
    }
    #crosshair::before {
      top: 10px;
      left: 0;
      width: 24px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 10px;
      width: 2px;
      height: 24px;
    }
    #crosshair .dot {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 4px;
      height: 4px;
      background: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff0055;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="damage-flash"></div>
  <div id="crosshair"><div class="dot"></div></div>
  <div id="ui-layer"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
